<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Xitoy nakladnoy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mat: #123F38; --mat-deep: #0C2E29; --mat-line: rgba(160,230,210,.09);
      --kapton: #F0A531; --kapton-deep: #C97F12;
      --paper: #F3F5F2; --card: #FFFFFF; --ink: #15201E; --muted: #62716D; --hair: #DDE3DF;
      --danger: #B4412B;
      --s-draft: #62716D; --s-sent: #2F6FB0; --s-received: #3D7A3A; --s-cancel: #B4412B;
      --display: "Unbounded", "Onest", system-ui, sans-serif;
      --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--paper); overflow-x: hidden; }
    body { font-family: var(--body); color: var(--ink); font-size: 15px; line-height: 1.4; font-variant-numeric: tabular-nums;
      padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--kapton); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .wrap { max-width: 980px; margin: 0 auto; }

    .top { color: #EAF6F2; padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 18px;
      background:
        linear-gradient(var(--mat-line) 1px, transparent 1px) 0 0 / 22px 22px,
        linear-gradient(90deg, var(--mat-line) 1px, transparent 1px) 0 0 / 22px 22px,
        radial-gradient(120% 100% at 90% 0%, #1A5248, var(--mat) 55%, var(--mat-deep)); }
    .brand { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
    .brand em { font-style: normal; color: var(--kapton); }
    .top p { margin-top: 6px; font-size: 13px; color: #A9CFC6; }

    .tabs { position: sticky; top: 0; z-index: 20; background: rgba(243,245,242,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--hair); }
    .tabs .wrap { display: flex; gap: 4px; padding: 8px 12px; }
    .tab { flex: 1; border: 0; background: transparent; height: 40px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
    .tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--hair), 0 4px 12px -8px rgba(0,0,0,.25); }
    .tab i { font-style: normal; font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 4px; }

    main { padding: 12px; }
    .panel { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .grid { display: grid; gap: 10px; }
    .label { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; display: block; }
    .inp, select, textarea { width: 100%; height: 42px; border: 1.5px solid var(--hair); border-radius: 10px; background: var(--paper); padding: 0 12px; font-size: 16px; }
    textarea { height: auto; min-height: 60px; padding: 10px 12px; resize: vertical; }
    .inp:focus, select:focus, textarea:focus { outline: 0; border-color: var(--mat); background: #fff; }
    .editing { font-size: 12.5px; font-weight: 600; color: var(--kapton-deep); }
    .linkbtn { border: 0; background: none; color: var(--mat); font-weight: 600; font-size: 13px; text-decoration: underline; }

    .tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: var(--card); border: 1.5px solid var(--hair); border-radius: 12px; }
    .search:focus-within { border-color: var(--mat); }
    .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; min-width: 0; }
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; border: 1px solid var(--hair); background: var(--card); height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; }
    .chip i { font-style: normal; color: var(--muted); font-size: 11.5px; margin-left: 4px; }
    .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .chip[aria-pressed="true"] i { color: #C9D3D0; }

    .list { display: flex; flex-direction: column; gap: 6px; }
    .prod { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; }
    .prod.on { border-color: var(--mat); box-shadow: inset 4px 0 0 var(--mat); }
    .prod .nm { font-weight: 600; font-size: 14px; word-break: break-word; }
    .prod .sub { font-size: 12px; color: var(--muted); }
    .stock { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--paper); white-space: nowrap; }
    .stock.low { background: #FBE6E1; color: var(--danger); }
    .prod .ins { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .prod .ins label { display: flex; align-items: center; gap: 6px; height: 38px; border: 1.5px solid var(--hair); border-radius: 10px; padding: 0 10px; background: var(--paper); font-size: 12px; color: var(--muted); }
    .prod .ins label:focus-within { border-color: var(--mat); background: #fff; }
    .prod .ins input { flex: 1; width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--ink); text-align: right; }
    .more { margin: 10px auto 0; display: block; }
    .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }

    .btn { border: 1px solid var(--hair); background: var(--paper); height: 40px; padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn.primary { background: var(--mat); border-color: var(--mat); color: #fff; }
    .btn.accent { background: var(--kapton); border-color: var(--kapton); color: #2B1A00; }
    .btn.danger { color: var(--danger); }
    .btn:disabled { opacity: .5; }

    .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.97); border-top: 1px solid var(--hair);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .savebar .wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .savebar .sum { flex: 1 0 100%; font-size: 13px; color: var(--muted); }
    .savebar .btn { flex: 1 1 0; }
    .savebar .btn.primary { flex-grow: 1.6; }
    .savebar .sum b { color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 15px; }

    .inv { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; overflow: hidden; border-left: 4px solid var(--sc, var(--hair)); margin-bottom: 8px; }
    .inv-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; width: 100%; text-align: left; border: 0; background: transparent; }
    .inv-id { font-family: var(--display); font-weight: 600; font-size: 13px; }
    .inv-who { font-weight: 600; }
    .inv-sum { text-align: right; font-weight: 600; white-space: nowrap; }
    .inv-meta { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
    .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: #fff; background: var(--sc, var(--muted)); }
    .inv-body { border-top: 1px dashed var(--hair); padding: 12px 14px 14px; display: grid; gap: 12px; }
    .items { width: 100%; border-collapse: collapse; font-size: 13px; }
    .items th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
    .items td { padding: 6px 0; border-bottom: 1px solid var(--paper); vertical-align: top; }
    .items th:not(:first-child), .items td:not(:first-child) { text-align: right; white-space: nowrap; padding-left: 10px; }
    .items .rcv { width: 72px; height: 32px; border: 1.5px solid var(--hair); border-radius: 8px; text-align: right; padding: 0 8px; font-size: 15px; background: var(--paper); }
    .items .diff { color: var(--danger); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .note { font-size: 13px; background: var(--paper); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; }
    .timeline { list-style: none; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }

    .gate { max-width: 420px; margin: 18vh auto 0; padding: 24px; text-align: center; }
    .gate h1 { font-family: var(--display); font-size: 20px; margin-bottom: 10px; }
    .gate p { color: var(--muted); }
    .warnbar { background: #FDF0DA; color: #8A5608; font-size: 13px; padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }
    .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 50; transform: translate(-50%, 260%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; transition: transform .3s cubic-bezier(.2,.9,.3,1.2); width: max-content; max-width: 90vw; }
    .toast:not(.show) { opacity: 0; pointer-events: none; transition: transform .3s, opacity 0s .3s; }
    .toast.show { transform: translate(-50%, 0); }

    @media (min-width: 720px) {
      .grid.cols { grid-template-columns: 1fr 1fr 140px; }
      .tools { flex-direction: row; align-items: center; }
      .tools .search { flex: 0 0 320px; }
      .prod { grid-template-columns: minmax(0, 1fr) auto 260px; }
      .prod .ins { grid-column: auto; }
      .savebar .sum { flex: 1 1 auto; }
      .savebar .btn { flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <div class="gate" id="gate" hidden>
    <h1>Kirish kerak</h1>
    <p id="gateMsg">Botga <b>/nakladnoy</b> deb yozing va kelgan tugma yoki havola orqali kiring.</p>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="wrap">
        <div class="brand">Ekranchi <em>→ 中国</em></div>
        <p>Xitoydagi hamkorlar uchun nakladnoy (zakaz). Mijozlar buni ko'rmaydi.</p>
      </div>
    </header>
    <nav class="tabs"><div class="wrap" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="edit">Yangi nakladnoy</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="hist">Tarix <i id="histCount"></i></button>
    </div></nav>

    <main class="wrap">
      <div class="warnbar" id="persistNote" hidden>⚠️ Doimiy baza ulanmagan: nakladnoylar vaqtincha saqlanadi.</div>

      <section id="tab-edit">
        <div class="panel">
          <h3><span>Hamkor</span><span class="editing" id="editing" hidden></span></h3>
          <div class="grid cols">
            <div><label class="label" for="partner">Hamkor nomi</label>
              <input class="inp" id="partner" list="partners" maxlength="100" placeholder="Masalan: Shenzhen Li"></div>
            <div><label class="label" for="contact">Aloqa (WeChat / tel)</label>
              <input class="inp" id="contact" maxlength="100" placeholder="WeChat ID"></div>
            <div><label class="label" for="currency">Valyuta</label>
              <select id="currency"><option value="CNY">¥ Yuan</option><option value="USD">$ Dollar</option></select></div>
          </div>
          <datalist id="partners"></datalist>
          <div style="margin-top:10px"><label class="label" for="note">Izoh (hamkorga, xitoycha/inglizcha yozgan ma'qul)</label>
            <textarea id="note" maxlength="1000" placeholder="例如: 请尽快发货 / Please ship ASAP"></textarea></div>
        </div>

        <div class="tools">
          <label class="search"><span aria-hidden="true">🔎</span><input id="q" type="search" placeholder="Model qidirish…" autocomplete="off"></label>
          <div class="chips" id="chips"></div>
        </div>
        <div class="list" id="prods"></div>
        <button class="btn more" id="more" hidden>Yana ko'rsatish</button>
      </section>

      <section id="tab-hist" hidden>
        <div id="invs"></div>
      </section>
    </main>

    <div class="savebar" id="savebar">
      <div class="wrap">
        <div class="sum" id="sum">Model tanlanmagan</div>
        <button class="btn" id="clear" hidden>Tozalash</button>
        <button class="btn" id="save">Saqlash</button>
        <button class="btn primary" id="send">📤 Yuborish</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  const API = '/api/index';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtN = (n) => Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const money = (n) => (Math.round((n || 0) * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const SYM = { CNY: '¥', USD: '$' };
  const when = (t) => t ? new Date(t).toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  const toastEl = $('toast'); let tt;
  const toast = (m) => { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 2800); };

  /* ---- kirish tokeni (admin panel bilan bir xil) ---- */
  const url = new URL(location.href);
  let token = url.searchParams.get('k');
  try {
    if (token) { localStorage.setItem('ekr_admin_token', token); url.searchParams.delete('k'); history.replaceState(null, '', url.pathname + url.search); }
    else token = localStorage.getItem('ekr_admin_token');
  } catch (e) {}
  if (!token) { $('gate').hidden = false; return; }

  async function api(action, body) {
    const r = await fetch(`${API}?admin=${action}`, {
      method: body ? 'POST' : 'GET',
      headers: { 'X-Admin-Token': token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { try { localStorage.removeItem('ekr_admin_token'); } catch (e) {} $('app').hidden = true; $('gate').hidden = false; $('gateMsg').textContent = j.error || 'Kirish muddati tugagan.'; throw new Error('auth'); }
    if (!r.ok) throw new Error(j.error || 'Server xatosi');
    return j;
  }

  let products = [], prodById = new Map(), invoices = [], prices = {}, STATUSES = {}, LOW = 10;
  let sel = new Map();            // id -> {qty, price}
  let editingId = null;
  let q = '', filter = 'low', limit = 80;
  const openInv = new Set(), receiving = new Set();

  async function load() {
    try {
      const d = await api('supply_data');
      products = d.products || []; prodById = new Map(products.map(p => [String(p.id), p]));
      invoices = d.invoices || []; prices = d.prices || {}; STATUSES = d.statuses || {}; LOW = d.low_stock ?? 10;
      $('persistNote').hidden = !!d.persistent;
      $('gate').hidden = true; $('app').hidden = false;
      restoreDraft();
      renderAll();
    } catch (e) {
      if (e.message === 'auth') return;
      $('gate').hidden = false; $('gateMsg').innerHTML = 'Maʼlumotni yuklab boʻlmadi. <a href="#" onclick="location.reload();return false"><b>Qayta urinib koʻring</b></a>.';
    }
  }

  /* ---- qoralamani brauzerda eslab qolish (tasodifan yopilsa yo'qolmasin) ---- */
  const DRAFT_KEY = 'ekr_supply_draft';
  function saveDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ editingId, partner: $('partner').value, contact: $('contact').value,
        currency: $('currency').value, note: $('note').value, items: [...sel] }));
    } catch (e) {}
  }
  function restoreDraft() {
    let d; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
    if (!d) return;
    $('partner').value = d.partner || ''; $('contact').value = d.contact || ''; $('note').value = d.note || '';
    $('currency').value = SYM[d.currency] ? d.currency : 'CNY';
    sel = new Map((d.items || []).filter(([id]) => prodById.has(String(id))));
    const inv = d.editingId && invoices.find(x => x.id === d.editingId);
    editingId = inv && ['draft', 'sent'].includes(inv.status) ? inv.id : null;
    if (sel.size) filter = 'sel';
  }
  function resetEditor() {
    sel.clear(); editingId = null;
    ['partner', 'contact', 'note'].forEach(id => $(id).value = '');
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    filter = 'low'; renderEditor();
  }

  function renderAll() { renderPartners(); renderEditor(); renderHistory(); }

  function renderPartners() {
    const seen = new Map();
    invoices.forEach(i => { if (i.partner && !seen.has(i.partner)) seen.set(i.partner, i.contact || ''); });
    $('partners').innerHTML = [...seen.keys()].map(p => `<option value="${esc(p)}">`).join('');
    $('partner').onchange = () => { const c = seen.get($('partner').value); if (c && !$('contact').value) $('contact').value = c; saveDraft(); };
  }

  /* ---------- Muharrir ---------- */
  const lastPrice = (id) => { const p = prices[id]; return p ? p[$('currency').value] : null; };
  const isLow = (p) => (p.stock || 0) <= LOW;

  function renderChips() {
    const brands = [...new Set(products.map(p => p.brand))].sort();
    const low = products.filter(p => p.active !== false && isLow(p)).length;
    const chips = [['low', `Kam qolgan`, low], ['sel', 'Tanlangan', sel.size], ['all', 'Hammasi', products.length],
      ...brands.map(b => ['b:' + b, b, products.filter(p => p.brand === b).length])];
    $('chips').innerHTML = chips.map(([k, t, n]) => `<button class="chip" data-f="${esc(k)}" aria-pressed="${filter === k}">${esc(t)}<i>${n}</i></button>`).join('');
  }

  function filtered() {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = products.filter(p => {
      if (filter === 'low' && !(p.active !== false && isLow(p))) return false;
      if (filter === 'sel' && !sel.has(String(p.id))) return false;
      if (filter.startsWith('b:') && p.brand !== filter.slice(2)) return false;
      if (!words.length) return true;
      const hay = `${p.brand} ${p.name} ${p.type}`.toLowerCase();
      return words.every(w => hay.includes(w));
    });
    if (filter === 'low') list.sort((a, b) => (a.stock || 0) - (b.stock || 0));
    return list;
  }

  function prodHTML(p) {
    const id = String(p.id), s = sel.get(id), lp = lastPrice(id), sym = SYM[$('currency').value];
    return `<div class="prod${s ? ' on' : ''}" data-id="${esc(id)}">
      <div><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.brand)} · ${esc(p.type)}${p.active === false ? ' · yashirin' : ''}</div></div>
      <span class="stock${isLow(p) ? ' low' : ''}">omborda ${fmtN(p.stock)}</span>
      <div class="ins">
        <label>Soni<input inputmode="numeric" data-k="qty" value="${s ? esc(s.qty) : ''}" placeholder="0"></label>
        <label>Narx ${sym}<input inputmode="decimal" data-k="price" value="${s && s.price != null ? esc(s.price) : ''}" placeholder="${lp != null ? esc(lp) : '—'}"></label>
      </div></div>`;
  }

  function renderProducts() {
    const list = filtered();
    $('prods').innerHTML = list.length ? list.slice(0, limit).map(prodHTML).join('')
      : `<div class="empty">${filter === 'sel' ? 'Hali model tanlanmagan. «Kam qolgan» yoki qidiruvdan soni kiriting.' : 'Hech narsa topilmadi'}</div>`;
    $('more').hidden = list.length <= limit;
  }

  function renderSum() {
    let qty = 0, total = 0, priced = 0;
    sel.forEach((s, id) => { qty += s.qty; const pr = s.price ?? lastPrice(id); if (pr != null) { total += pr * s.qty; priced++; } });
    const sym = SYM[$('currency').value];
    $('sum').innerHTML = sel.size ? `<b>${sel.size}</b> model · <b>${fmtN(qty)}</b> dona${priced ? ` · <b>${sym}${money(total)}</b>` : ''}` : 'Model tanlanmagan';
    $('clear').hidden = !sel.size && !editingId;
    $('save').disabled = $('send').disabled = !sel.size;
    $('editing').hidden = !editingId; $('editing').textContent = editingId ? `${editingId} tahrirlanmoqda` : '';
  }

  function renderEditor() { renderChips(); renderProducts(); renderSum(); }

  $('prods').addEventListener('input', (e) => {
    const inp = e.target.closest('input'); if (!inp) return;
    const row = inp.closest('.prod'), id = row.dataset.id;
    const qtyEl = row.querySelector('[data-k=qty]'), priceEl = row.querySelector('[data-k=price]');
    const qty = parseInt(qtyEl.value.replace(/\D/g, ''), 10);
    const priceRaw = priceEl.value.replace(',', '.').trim();
    const price = priceRaw === '' ? null : parseFloat(priceRaw);
    if (qty > 0) sel.set(id, { qty, price: Number.isFinite(price) && price >= 0 ? price : null });
    else sel.delete(id);
    row.classList.toggle('on', qty > 0);
    renderSum(); saveDraft();
    const chip = $('chips').querySelector('[data-f="sel"] i'); if (chip) chip.textContent = sel.size;
  });
  $('chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (!c) return; filter = c.dataset.f; limit = 80; renderEditor(); });
  $('q').addEventListener('input', (e) => { q = e.target.value; limit = 80; if (q && filter === 'low') filter = 'all'; renderEditor(); });
  $('more').onclick = () => { limit += 120; renderProducts(); };
  $('currency').onchange = () => { renderEditor(); saveDraft(); };
  ['partner', 'contact', 'note'].forEach(id => $(id).addEventListener('input', saveDraft));
  $('clear').onclick = () => { if (confirm('Tanlovni tozalab, yangi nakladnoy boshlaysizmi?')) resetEditor(); };

  async function submit(send) {
    if (!sel.size) return;
    const body = { id: editingId || undefined, partner: $('partner').value, contact: $('contact').value,
      currency: $('currency').value, note: $('note').value, send,
      items: [...sel].map(([id, s]) => ({ id, qty: s.qty, price: s.price ?? lastPrice(id) ?? null })) };
    $('save').disabled = $('send').disabled = true;
    try {
      const r = await api('supply_save', body);
      upsert(r.invoice); openInv.add(r.invoice.id);
      body.items.forEach(it => { if (it.price != null) prices[it.id] = { ...(prices[it.id] || {}), [body.currency]: it.price }; });
      resetEditor(); renderPartners(); renderHistory();
      if (r.error) toast(r.error);
      else toast(send ? `${r.invoice.id} botga yuborildi — Excel faylni hamkorga uzating` : `${r.invoice.id} saqlandi`);
      if (send && tg && r.sent) { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} }
      switchTab('hist');
    } catch (e) { if (e.message !== 'auth') toast(e.message); renderSum(); }
  }
  $('save').onclick = () => submit(false);
  $('send').onclick = () => submit(true);

  /* ---------- Tarix ---------- */
  const sc = (s) => `var(--s-${STATUSES[s] ? s : 'draft'})`;
  const invQty = (i) => i.items.reduce((s, it) => s + it.qty, 0);
  const invTotal = (i) => i.items.reduce((s, it) => s + (it.price || 0) * it.qty, 0);
  function upsert(inv) { const k = invoices.findIndex(x => x.id === inv.id); if (k >= 0) invoices[k] = inv; else invoices.unshift(inv); }

  function invHTML(i) {
    const sym = SYM[i.currency] || '', total = invTotal(i), isOpen = openInv.has(i.id), rcv = receiving.has(i.id);
    const recvSum = i.items.reduce((s, it) => s + (it.recv || 0), 0);
    const rows = i.items.map(it => `<tr data-id="${esc(it.id)}"><td>${esc(it.brand)} <b>${esc(it.name)}</b></td><td>${fmtN(it.qty)}</td>
      <td>${it.price ? sym + money(it.price) : '—'}</td>
      <td>${rcv ? `<input class="rcv" inputmode="numeric" value="${it.recv ?? it.qty}">` : (it.recv != null ? `<span class="${it.recv !== it.qty ? 'diff' : ''}">${fmtN(it.recv)}</span>` : '—')}</td></tr>`).join('');
    const canEdit = ['draft', 'sent'].includes(i.status);
    return `<article class="inv" style="--sc:${sc(i.status)}" data-id="${esc(i.id)}">
      <button class="inv-head" data-act="toggle" aria-expanded="${isOpen}">
        <span class="inv-id">${esc(i.id)}</span><span class="inv-sum">${fmtN(invQty(i))} dona</span>
        <span class="inv-who">${esc(i.partner || 'Hamkor koʻrsatilmagan')}</span><span class="inv-sum">${total ? sym + money(total) : ''}</span>
        <span class="inv-meta"><span class="pill">${esc(STATUSES[i.status] || i.status)}</span>${esc(when(i.created))} · ${i.items.length} model${i.status === 'received' ? ` · keldi ${fmtN(recvSum)} dona` : ''}</span>
      </button>
      ${isOpen ? `<div class="inv-body">
        ${i.contact ? `<div class="note">📞 ${esc(i.contact)}</div>` : ''}
        ${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}
        <table class="items"><thead><tr><th>Model</th><th>Zakaz</th><th>Narx</th><th>Keldi</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="actions">
          ${rcv ? `<button class="btn accent" data-act="recv-save">✅ Omborga qo'shish</button><button class="btn" data-act="recv-cancel">Bekor</button>` : `
          <button class="btn primary" data-act="send">📤 Excelni botga yuborish</button>
          ${i.status !== 'cancel' ? `<button class="btn accent" data-act="recv">📦 ${i.status === 'received' ? 'Kelganini tuzatish' : 'Tovar keldi'}</button>` : ''}
          ${canEdit ? `<button class="btn" data-act="edit">✏️ Tahrirlash</button><button class="btn" data-act="copy">⧉ Nusxa</button><button class="btn danger" data-act="cancel">Bekor qilish</button>` : `<button class="btn" data-act="copy">⧉ Nusxa olib yangi</button>`}`}
        </div>
        ${rcv ? `<div class="note">Har bir modeldan nechta kelganini kiriting. Farq omborga qo'shiladi (yoki ayriladi), kutayotgan mijozlarga xabar ketadi.</div>` : ''}
        <ul class="timeline">${(i.history || []).map(x => `<li>${esc(when(x.t))} — ${esc(STATUSES[x.s] || x.s)}${x.note ? ': ' + esc(x.note) : ''}</li>`).join('')}</ul>
      </div>` : ''}
    </article>`;
  }

  function renderHistory() {
    $('histCount').textContent = invoices.length || '';
    $('invs').innerHTML = invoices.length ? invoices.map(invHTML).join('') : '<div class="empty">Hali nakladnoy yoʻq</div>';
  }

  function loadIntoEditor(inv, keepId) {
    editingId = keepId ? inv.id : null;
    $('partner').value = inv.partner || ''; $('contact').value = inv.contact || ''; $('note').value = inv.note || '';
    $('currency').value = SYM[inv.currency] ? inv.currency : 'CNY';
    sel = new Map(inv.items.filter(it => prodById.has(String(it.id))).map(it => [String(it.id), { qty: it.qty, price: it.price ?? null }]));
    filter = 'sel'; q = ''; $('q').value = '';
    saveDraft(); switchTab('edit'); renderEditor(); window.scrollTo(0, 0);
  }

  $('invs').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const card = b.closest('.inv'), id = card.dataset.id, inv = invoices.find(x => x.id === id), act = b.dataset.act;
    if (act === 'toggle') { openInv.has(id) ? openInv.delete(id) : openInv.add(id); return renderHistory(); }
    if (act === 'edit') {
      if (sel.size && editingId !== id && !confirm('Hozirgi tanlov oʻrniga shu nakladnoy ochilsinmi?')) return;
      return loadIntoEditor(inv, true);
    }
    if (act === 'copy') {
      if (sel.size && !confirm('Hozirgi tanlov oʻrniga shu nakladnoydan nusxa olinsinmi?')) return;
      return loadIntoEditor(inv, false);
    }
    if (act === 'recv') { receiving.add(id); return renderHistory(); }
    if (act === 'recv-cancel') { receiving.delete(id); return renderHistory(); }
    b.disabled = true;
    try {
      if (act === 'send') { const r = await api('supply_send', { id }); upsert(r.invoice); toast('Excel nakladnoy botga yuborildi'); }
      if (act === 'cancel') {
        if (!confirm(`${id} bekor qilinsinmi?`)) { b.disabled = false; return; }
        const r = await api('supply_cancel', { id }); upsert(r.invoice); toast('Bekor qilindi');
        if (editingId === id) resetEditor();
      }
      if (act === 'recv-save') {
        const items = [...card.querySelectorAll('tbody tr')].map(tr => ({ id: tr.dataset.id, qty: parseInt((tr.querySelector('.rcv').value || '0').replace(/\D/g, ''), 10) || 0 }));
        const r = await api('supply_receive', { id, items });
        upsert(r.invoice); receiving.delete(id);
        const fresh = await api('supply_data'); products = fresh.products || products; prodById = new Map(products.map(p => [String(p.id), p]));
        renderEditor();
        toast(r.added ? `Omborga ${r.added > 0 ? '+' : ''}${r.added} dona qoʻshildi` : 'Oʻzgarish yoʻq');
        if (editingId === id) resetEditor();
      }
      renderHistory();
    } catch (err) { if (err.message !== 'auth') toast(err.message); b.disabled = false; }
  });

  /* ---------- Tablar ---------- */
  function switchTab(t) {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === t));
    $('tab-edit').hidden = t !== 'edit'; $('tab-hist').hidden = t !== 'hist';
    $('savebar').hidden = t !== 'edit';
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tab').forEach(x => x.onclick = () => switchTab(x.dataset.tab));

  load();
})();
</script>
</body>
</html>
