<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ekranchi_Bola — displeylar ombori</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="data.js?v=wow_v5"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mat: #123F38;        /* antistatik gilamcha rangi */
      --mat-deep: #0C2E29;
      --mat-line: rgba(160, 230, 210, .09);
      --kapton: #F0A531;     /* kapton skotch rangi */
      --kapton-deep: #C97F12;
      --paper: #F3F5F2;
      --card: #FFFFFF;
      --ink: #15201E;
      --muted: #62716D;
      --hair: #DDE3DF;
      --glow: #D6F8FF;
      --danger: #B4412B;
      --r-md: 14px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --display: "Unbounded", "Onest", system-ui, sans-serif;
      --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--paper); }
    body {
      font-family: var(--body);
      color: var(--ink); font-size: 15px; line-height: 1.4;
      padding-bottom: calc(96px + var(--safe-b));
      font-variant-numeric: tabular-nums;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--kapton); outline-offset: 2px; }
    [hidden] { display: none !important; }

    /* ============ HERO: ekran yonishi ============ */
    .hero {
      position: relative; overflow: hidden; color: #EAF6F2;
      background:
        linear-gradient(var(--mat-line) 1px, transparent 1px) 0 0 / 22px 22px,
        linear-gradient(90deg, var(--mat-line) 1px, transparent 1px) 0 0 / 22px 22px,
        radial-gradient(120% 90% at 85% 10%, #1A5248 0%, var(--mat) 55%, var(--mat-deep) 100%);
      padding: 28px 18px 22px;
      display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
    }
    .hero-copy { position: relative; z-index: 2; }
    .logo {
      font-family: var(--display); font-weight: 800;
      font-size: 34px; line-height: .95; letter-spacing: -0.03em;
    }
    .logo em { display: block; font-style: normal; color: var(--kapton); font-size: .78em; letter-spacing: -0.02em; margin-top: 2px; }
    .logo span { display: block; font-family: var(--body); font-size: 13.5px; font-weight: 500; letter-spacing: 0; margin-top: 10px; color: #A9CFC6; line-height: 1.3; }
    .hero-note {
      margin-top: 14px; min-height: 38px; font-size: 13.5px; color: #E6F4F0; max-width: 26ch;
      transition: opacity .35s ease;
    }
    .hero-note b { color: var(--kapton); font-weight: 600; }

    .device {
      position: relative; z-index: 2; width: 92px; height: 176px; border-radius: 20px;
      background: #0A1614; padding: 6px;
      box-shadow: 0 0 0 1.5px #2E6258, 0 18px 40px -12px rgba(0,0,0,.6);
      transform: rotate(6deg);
    }
    .device-screen {
      position: relative; width: 100%; height: 100%; border-radius: 15px; overflow: hidden;
      background: radial-gradient(90% 70% at 30% 20%, #FFFFFF 0%, var(--glow) 30%, #7FD6EE 70%, #3C8FB0 100%);
      animation: powerOn 1.1s cubic-bezier(.2,.8,.2,1) .25s both;
    }
    .device-screen::after {
      content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px);
      mix-blend-mode: multiply;
    }
    .device-count {
      position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
      font-family: var(--display); color: #0C3440; z-index: 1;
      animation: fadeIn .5s ease 1.2s both;
    }
    .device-count strong { font-size: 28px; font-weight: 800; line-height: 1; }
    .device-count small { font-family: var(--body); font-size: 11px; font-weight: 600; margin-top: 4px; }
    .hero-glow {
      position: absolute; right: -30px; top: -10px; width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, rgba(127,214,238,.35), transparent 65%);
      animation: fadeIn 1.2s ease .6s both; z-index: 1; pointer-events: none;
    }
    @keyframes powerOn {
      0%   { transform: scale(1, .006); filter: brightness(4); opacity: 0; }
      12%  { transform: scale(1, .006); filter: brightness(4); opacity: 1; }
      45%  { transform: scale(1, 1);    filter: brightness(2.2); }
      100% { transform: scale(1, 1);    filter: brightness(1); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ============ Kapton lenta: optom hisoblagich ============ */
    .tape-wrap { background: var(--mat-deep); padding: 12px 18px 16px; color: #CFE5DF; }
    .tape-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; margin-bottom: 8px; gap: 10px; }
    .tape-head b { color: #fff; font-weight: 600; }
    .tape-head .count { font-family: var(--display); font-size: 12px; color: var(--kapton); white-space: nowrap; }
    .ruler {
      position: relative; height: 26px; border-radius: 4px;
      background:
        repeating-linear-gradient(90deg, rgba(207,229,223,.55) 0 1px, transparent 1px 2%) bottom / 100% 6px no-repeat,
        repeating-linear-gradient(90deg, rgba(207,229,223,.85) 0 1.5px, transparent 1.5px 10%) bottom / 100% 12px no-repeat,
        #173F39;
      overflow: hidden;
    }
    .tape {
      position: absolute; left: 0; top: 3px; bottom: 7px; width: 0%;
      background:
        linear-gradient(180deg, rgba(255,255,255,.35), transparent 40%),
        linear-gradient(90deg, var(--kapton-deep), var(--kapton));
      opacity: .92;
      clip-path: polygon(0 0, 100% 0, calc(100% - 3px) 20%, 100% 40%, calc(100% - 3px) 60%, 100% 80%, calc(100% - 3px) 100%, 0 100%);
      transition: width .45s cubic-bezier(.3,1.4,.5,1);
    }
    .tape-wrap.done .tape { width: 100% !important; clip-path: none; }
    .tape-wrap.done .tape-head b { color: var(--kapton); }

    /* ============ Qidiruv va brendlar ============ */
    .toolbar {
      position: sticky; top: 0; z-index: 30; background: rgba(243,245,242,.93);
      backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
      padding: 12px 14px 8px; border-bottom: 1px solid transparent; transition: border-color .2s;
    }
    .toolbar.stuck { border-bottom-color: var(--hair); }
    .search {
      display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 14px;
      background: var(--card); border: 1.5px solid var(--hair); border-radius: var(--r-md);
    }
    .search:focus-within { border-color: var(--mat); }
    .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; min-width: 0; }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
    .search .clear { border: 0; background: var(--paper); width: 30px; height: 30px; border-radius: 50%; color: var(--muted); display: none; }
    .search.has-text .clear { display: block; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; border: 1px solid var(--hair); background: var(--card); color: var(--ink);
      height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chip i { font-style: normal; font-size: 11px; color: var(--muted); }
    .chip[aria-pressed="true"] { background: var(--mat); border-color: var(--mat); color: #fff; }
    .chip[aria-pressed="true"] i { color: #9FC9BF; }

    .result-meta { padding: 4px 16px 8px; font-size: 12px; color: var(--muted); }

    /* ============ Mahsulotlar ============ */
    .list { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
      background: var(--card); border-radius: var(--r-md); padding: 12px;
      border: 1px solid var(--hair);
      content-visibility: auto; contain-intrinsic-size: auto 88px;
    }
    .row.in-cart { border-color: var(--kapton); box-shadow: inset 3px 0 0 var(--kapton); }
    .row.out { opacity: .55; }

    .glyph { width: 44px; height: 70px; border-radius: 9px; background: #1B2422; position: relative; align-self: start; }
    .glyph::before { content: ""; position: absolute; inset: 3px; border-radius: 6px; }
    .t-oled::before   { background: radial-gradient(circle at 30% 35%, #FF4FA3 0 3px, transparent 4px), radial-gradient(circle at 68% 60%, #4FE0FF 0 3px, transparent 4px), radial-gradient(circle at 40% 78%, #B6FF4F 0 2px, transparent 3px), #000; }
    .t-ips::before    { background: linear-gradient(160deg, #F4FDFF, #BDEBF8 60%, #8CCFE4); }
    .t-incell::before { background: linear-gradient(160deg, #E6F1F4, #AFCFD9 65%, #87AEBB); }
    .t-tft::before    { background: repeating-linear-gradient(180deg, #F3E9D2 0 5px, #E6D9BC 5px 10px); }
    .t-servis::before { background: linear-gradient(160deg, #2A2F3A, #0B0E14); box-shadow: inset 0 0 0 2px var(--kapton); }

    .info { min-width: 0; }
    .meta { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); font-weight: 500; }
    .type-tag { padding: 1px 6px; border-radius: 5px; background: var(--paper); color: var(--ink); font-weight: 600; font-size: 10.5px; white-space: nowrap; }
    .type-tag.servis { background: #FDF0DA; color: #8A5608; }
    .type-tag.oled { background: #16181D; color: #fff; }
    .name { font-weight: 700; font-size: 16px; line-height: 1.25; margin: 4px 0 4px; word-break: break-word; letter-spacing: -.005em; }
    .alts { font-size: 12.5px; color: var(--muted); line-height: 1.35; margin: -2px 0 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
    .alts.open { -webkit-line-clamp: unset; display: block; }
    .alts b { font-weight: 600; color: #3E4B48; }
    .type-tag.frame { background: #FFF6E6; color: #8A5608; }
    .price { display: flex; align-items: baseline; column-gap: 8px; flex-wrap: wrap; }
    .price b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
    .price s { font-size: 12px; color: var(--muted); }
    .price small { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
    .price small em { font-style: normal; color: var(--ink); font-weight: 600; }
    .wholesale .price b { color: #0F6B5A; }
    .low { flex-basis: 100%; font-size: 12px; font-weight: 600; color: var(--kapton-deep); }
    .out-label { font-size: 12px; color: var(--danger); font-weight: 600; }

    .add {
      border: 0; height: 40px; padding: 0 14px; border-radius: 12px;
      background: var(--mat); color: #fff; font-weight: 600; font-size: 13.5px;
      transition: transform .12s ease;
    }
    .add:active { transform: scale(.95); }
    .add:disabled { background: var(--hair); color: var(--muted); }
    .stepper { display: flex; align-items: center; background: #FFF6E6; border: 1.5px solid var(--kapton); border-radius: 12px; height: 40px; overflow: hidden; }
    .stepper button { width: 34px; height: 100%; border: 0; background: transparent; font-size: 20px; font-weight: 500; color: #7A4B06; }
    .stepper input { width: 40px; height: 100%; border: 0; background: transparent; text-align: center; font-weight: 700; font-size: 15px; outline: 0; -moz-appearance: textfield; }
    .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
    .empty button { margin-top: 14px; border: 1px solid var(--hair); background: var(--card); padding: 10px 16px; border-radius: 12px; font-weight: 600; }

    /* ============ Pastki panel ============ */
    .dock {
      position: fixed; left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); z-index: 50;
      display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px;
      background: var(--mat-deep); color: #fff; border-radius: 20px;
      box-shadow: 0 16px 36px -14px rgba(12,46,41,.7);
      transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
    }
    .dock.hidden { transform: translateY(140%); }
    .dock-sum { flex: 1; min-width: 0; }
    .dock-sum small { display: block; font-size: 12px; color: #A9CFC6; }
    .dock-sum strong { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; }
    .dock-btn { border: 0; height: 48px; padding: 0 18px; border-radius: 14px; background: var(--kapton); color: #2B1A00; font-weight: 700; font-size: 14.5px; white-space: nowrap; }
    .dock.bump { animation: bump .35s ease; }
    @keyframes bump { 40% { transform: translateY(-4px) scale(1.015); } }

    /* ============ Sheetlar ============ */
    .scrim { position: fixed; inset: 0; z-index: 90; background: rgba(8,20,18,.55); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; max-height: 88vh;
      background: var(--card); border-radius: 26px 26px 0 0; display: flex; flex-direction: column;
      transform: translateY(105%); transition: transform .34s cubic-bezier(.2,.9,.25,1);
      padding-bottom: var(--safe-b); visibility: hidden;
    }
    .sheet.open { transform: translateY(0); visibility: visible; }
    .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--hair); margin: 10px auto 4px; flex: none; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px 12px; }
    .sheet-head h2 { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
    .link-btn { border: 0; background: none; color: var(--danger); font-weight: 600; font-size: 13.5px; padding: 6px; }
    .sheet-body { overflow-y: auto; padding: 0 18px; flex: 1; }
    .sheet-foot { padding: 14px 18px 16px; border-top: 1px solid var(--hair); }

    .line { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--hair); }
    .line:last-child { border-bottom: 0; }
    .line .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
    .line .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

    .total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; gap: 10px; }
    .total span { color: var(--muted); font-size: 13.5px; }
    .total strong { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
    .save-note { font-size: 12.5px; color: #0F6B5A; font-weight: 600; margin-bottom: 12px; min-height: 17px; }
    .primary { width: 100%; height: 52px; border: 0; border-radius: 16px; background: var(--mat); color: #fff; font-weight: 700; font-size: 15.5px; }
    .ghost { width: 100%; height: 44px; border: 0; background: none; color: var(--muted); font-weight: 600; margin-top: 6px; }

    .field { margin-bottom: 14px; }
    .field > label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field input, .field textarea {
      width: 100%; border: 1.5px solid var(--hair); background: var(--paper); border-radius: 12px;
      padding: 12px 14px; font-size: 16px; outline: 0; resize: none;
    }
    .field input:focus, .field textarea:focus { border-color: var(--mat); background: #fff; }
    .field .err { color: var(--danger); font-size: 12px; margin-top: 4px; display: none; }
    .field.invalid input, .field.invalid textarea { border-color: var(--danger); }
    .field.invalid .err { display: block; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--paper); padding: 4px; border-radius: 14px; }
    .seg button { border: 0; background: transparent; height: 52px; border-radius: 11px; font-weight: 600; font-size: 14px; line-height: 1.15; }
    .seg button small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 0 var(--hair), 0 4px 12px -6px rgba(0,0,0,.2); }

    .toast {
      position: fixed; left: 50%; top: 14px; z-index: 200; transform: translate(-50%, -160%);
      background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 500;
      transition: transform .3s cubic-bezier(.2,.9,.3,1.2); width: max-content; max-width: 90vw; text-align: center;
    }
    .toast.show { transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
    }
    @media (min-width: 640px) {
      .list, .result-meta { max-width: 640px; margin-left: auto; margin-right: auto; }
      .toolbar > * { max-width: 616px; margin-left: auto; margin-right: auto; }
      .sheet { max-width: 560px; margin: 0 auto; }
      .dock { max-width: 600px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-copy">
      <h1 class="logo">Ekranchi<em>_Bola</em><span>Telefon displeylari ulgurji va donalab</span></h1>
      <p class="hero-note" id="heroNote">Barcha displeylarga <b>2 oy kafolat</b></p>
    </div>
    <div class="device" aria-hidden="true">
      <div class="device-screen">
        <div class="device-count"><strong id="modelCount">456</strong><small>ta model</small></div>
      </div>
    </div>
  </header>

  <section class="tape-wrap" id="tapeWrap" aria-live="polite">
    <div class="tape-head">
      <b id="tapeText">50 ta olsangiz, optom narx</b>
      <span class="count" id="tapeCount">0/50</span>
    </div>
    <div class="ruler" role="progressbar" aria-label="Optom narxgacha" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0" id="ruler">
      <div class="tape" id="tape"></div>
    </div>
  </section>

  <div class="toolbar" id="toolbar">
    <label class="search" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#62716D" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Model: A10, Note 8, 13C…" aria-label="Model qidirish">
      <button class="clear" type="button" id="clearQ" aria-label="Qidiruvni tozalash">✕</button>
    </label>
    <div class="chips" id="chips" role="toolbar" aria-label="Brendlar"></div>
  </div>

  <div class="result-meta" id="resultMeta"></div>
  <main class="list" id="list"></main>

  <div class="dock hidden" id="dock">
    <div class="dock-sum">
      <small id="dockQty">0 ta ekran</small>
      <strong id="dockSum">0 soʻm</strong>
    </div>
    <button class="dock-btn" id="dockBtn" type="button">Savatni ochish</button>
  </div>

  <div class="scrim" id="scrim"></div>

  <section class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 id="cartTitle">Savat</h2>
      <button class="link-btn" id="clearCart" type="button">Tozalash</button>
    </div>
    <div class="sheet-body" id="cartLines"></div>
    <div class="sheet-foot">
      <div class="total"><span id="cartMode">Chakana narxda</span><strong id="cartTotal">0 soʻm</strong></div>
      <div class="save-note" id="saveNote"></div>
      <button class="primary" id="toCheckout" type="button">Rasmiylashtirish</button>
      <button class="ghost" data-close type="button">Xaridni davom ettirish</button>
    </div>
  </section>

  <section class="sheet" id="checkoutSheet" role="dialog" aria-modal="true" aria-labelledby="coTitle">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="coTitle">Yetkazib berish</h2></div>
    <div class="sheet-body">
      <div class="field" id="fName">
        <label for="custName">Ismingiz</label>
        <input id="custName" maxlength="30" autocomplete="name" placeholder="Masalan, Sardor">
        <div class="err">Ismingizni yozing</div>
      </div>
      <div class="field">
        <label>Qanday yetkazamiz?</label>
        <div class="seg" id="deliv">
          <button type="button" data-v="BTS" aria-pressed="true">BTS pochta<small>Viloyatlarga</small></button>
          <button type="button" data-v="Taksi" aria-pressed="false">Taksi<small>Tezkor, shahar ichida</small></button>
        </div>
      </div>
      <div class="field" id="fAddr">
        <label for="custAddress" id="addrLabel">BTS filiali va shahar/tuman</label>
        <textarea id="custAddress" rows="2" maxlength="80" placeholder="Viloyat, tuman, filial"></textarea>
        <div class="err">Manzilni yozing</div>
      </div>
    </div>
    <div class="sheet-foot">
      <div class="total"><span id="coMode">Jami</span><strong id="coTotal">0 soʻm</strong></div>
      <div class="save-note"></div>
      <button class="primary" id="submitOrder" type="button">Buyurtmani yuborish</button>
      <button class="ghost" id="backToCart" type="button">Savatga qaytish</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>

<script>
/* Narx va qoldiq admin paneldan boshqariladi: avval bazadan olamiz, bo'lmasa data.js ishlatiladi */
const CATALOG_URL = 'https://ekranchi-shop.vercel.app/api/index?catalog=1';
(function loadCatalog() {
  const list = document.getElementById('list');
  if (list) list.innerHTML = '<div class="empty" style="padding:56px 24px"><strong>Narxlar yangilanmoqda…</strong></div>';
  let done = false;
  const go = () => { if (done) return; done = true; if (list) list.innerHTML = ''; startShop(); };
  const timer = setTimeout(go, 5000);
  fetch(CATALOG_URL, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { if (d && Array.isArray(d.products) && d.products.length) window.__catalog = d.products; })
    .catch(() => {})
    .finally(() => { clearTimeout(timer); go(); });
})();

function startShop() {
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#123F38'); tg.setBackgroundColor('#F3F5F2'); } catch (e) {}
  }
  const haptic = (t = 'light') => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
  const $ = (id) => document.getElementById(id);
  const WHOLESALE_MIN = 50;
  const fmtN = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
  const fmt = (n) => fmtN(n) + ' soʻm';
  const norm = (s) => String(s).toLowerCase().replace(/[\s\-_/.()]+/g, '');

  const toastEl = $('toast'); let toastT;
  const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2400); };
  // Klaviatura tugmasidan ochilganda initData bo'sh bo'ladi, shuning uchun platformaga qaraymiz
  const inTelegram = () => !!(tg && tg.platform && tg.platform !== 'unknown');

  const SOURCE = (window.__catalog && window.__catalog.length) ? window.__catalog : (typeof productsData !== 'undefined' ? productsData : []);
  if (!SOURCE.length) {
    $('list').innerHTML = '<div class="empty"><strong>Katalog yuklanmadi</strong>Sahifani yopib, qayta oching.</div>';
    return;
  }

// Model nomlarini chiroyli ko'rinishga keltirish (faqat ko'rinish uchun; ID va narxlar o'zgarmaydi)
  function prettyModel(raw, brand) {
    let s = String(raw)
      .replace(/[／]/g, '/').replace(/[（]/g, '(').replace(/[）]/g, ')').replace(/[＋]/g, '+')
      .replace(/\((yin du|neidan)\)/gi, '').replace(/[\u3400-\u9fff]+/g, '')
        .replace(/\biq(oo|00)\s*/gi, 'iQOO ')
      .replace(/\s+/g, ' ').trim();
    const tags = new Set();
    // WF = ramkali (with frame)
    if (/(^|[\s\-\/])?WF\b|\dWF\b|[A-Z]WF\b/i.test(s)) { tags.add('Ramkali'); s = s.replace(/[\s\-]*WF\b/gi, ''); }
    // iPhone sifat kodlari
    if (/^iphone$/i.test(brand)) {
      const q = s.match(/-?F-?\((Q[^)]*)\)|-FHD\b/i);
      if (q) { tags.add(/FHD/i.test(q[0]) ? 'FHD' : 'F(' + q[1].toUpperCase() + ')'); s = s.replace(/-?F-?\(Q[^)]*\)|-FHD\b/gi, ''); }
      s = s.replace(/^(\d)(G|P)(W|B)\b/i, (m, n, gp, c) => `${n}${gp.toUpperCase() === 'P' ? ' Plus' : ''} ${c.toUpperCase() === 'W' ? '(oq)' : '(qora)'}`);
    }
    const WORDS = { NOTE:'Note', PRO:'Pro', MAX:'Max', PROMAX:'Pro Max', PLUS:'Plus', LITE:'Lite', MINI:'Mini', ULTRA:'Ultra', PRIME:'Prime', POWER:'Power',
      CORE:'Core', SPARK:'Spark', HOT:'Hot', CAMON:'Camon', POVA:'Pova', POP:'Pop', SMART:'Smart', NOVA:'Nova', PSMART:'P smart', NARZO:'Narzo', REALME:'Realme',
      REAIME:'Realme', REARLME:'Realme', RENO:'Reno', ZERO:'Zero', MAGIC:'Magic', PLAY:'Play', VISION:'Vision', VISON:'Vision', VOSON:'Vision', MI:'Mi', NEO:'Neo', AIR:'Air',
      POCO:'POCO', GO:'Go', VIP:'VIP', NFC:'NFC', INDIA:'India', NEW:'New', REDMI:'Redmi', SHARK:'Shark', NFC:'NFC', BIG:'Big', SE:'SE', GT:'GT', VIVO:'Vivo', OPPO:'OPPO', TECNO:'Tecno', ONEPLUS:'OnePlus',
      NORD:'Nord', FIND:'Find', MASTER:'Master', IQOO:'iQOO', IQ00:'iQOO', HD:'HD', FHD:'FHD', LTE:'LTE', OVERSEAS:'Global', VERSION:'', XM:'', RY:'', HOTE:'Hot' };
    const word = (w) => {
      const u = w.toUpperCase();
      if (u in WORDS) return WORDS[u];
      if (/^\d+G$/i.test(w)) return u;                        // 4G, 5G
      return u;                                               // model kodlari: A02S, KF6, BD4 ...
    };
    const fixOne = (part) => {
      let p = part.trim();
      if (!p) return '';
      p = p.replace(/^(RY|XM)\s*/i, '');
      if (/redmi/i.test(brand)) p = p.replace(/^HM\s*/i, 'Redmi ');                       // RY = Honor, XM = Xiaomi
      // so'z va raqam orasiga bo'sh joy: NOTE8 -> NOTE 8, 13PROMAX -> 13 PROMAX, HOT12PLAY -> HOT 12 PLAY
      p = p.replace(/\b(NOTE|HOT|SPARK|CAMON|POVA|POP|SMART|NOVA|NARZO|REALME|REAIME|RENO|ZERO|MAGIC|MI|POCO|VISION|VISON|PLAY|GT|GO)(?=\d)/gi, '$1 ')
           .replace(/(\d[A-Z]?)(PROMAX|PRO|MAX|PLUS|LITE|MINI|PRIME|POWER|PLAY|NEO|AIR|SE|VIP|CORE|INDIA|NEW)/gi, '$1 $2')
           .replace(/(PLAY)(NFC)\b/gi, '$1 $2').replace(/\b(POCO)(?=[A-Z]\d)/gi, '$1 ').replace(/\b(SPARK)(GO)/gi, '$1 $2')
           .replace(/\b(PRO)(MAX|PLUS)\b/gi, '$1 $2')
           .replace(/\b(realme|narzo|reno)(?=[a-z])/gi, '$1 ')
           .replace(/\b(POVA|NOVA)(NEO|\d)/gi, '$1 $2')
           .replace(/\b(\d+[A-Z]?)(\d)G\b/g, '$1 $2G');
      p = p.split(/(\s+|[-()+.])/).map(t => /^[A-Za-z]+\d*[A-Za-z]*$/.test(t) && /[A-Za-z]{2,}/.test(t) && !/\d/.test(t) ? word(t) : (/[a-z]/.test(t) && /\d/.test(t) ? t.toUpperCase() : t)).join('');
      // Samsung: A02S -> A02s
      if (/samsung/i.test(brand)) p = p.replace(/\b([AM]\d{2})S\b/g, '$1s');
      p = p.replace(/(\d)I\b/g, '$1i').replace(/\(QORA\)/g, '(qora)').replace(/\(OQ\)/g, '(oq)');
      p = p.replace(/\s{2,}/g, ' ').replace(/\s+([)\]])/g, '$1').replace(/-\s*$/,'').trim();
      if (/huawei/i.test(brand) && /^RY\b/i.test(part.trim())) p = 'Honor ' + p;
      return p;
    };
    const seen = new Set(); const parts = [];
    s.split('/').map(fixOne).forEach(p => {
      if (!p) return;
      if (/^\d+G$/.test(p) && parts.length) p = parts[parts.length - 1].replace(/\b\d+G\b/, p);   // "Mi 11 Lite 4G / 5G"
      if (!seen.has(p.toLowerCase())) { seen.add(p.toLowerCase()); parts.push(p); }
    });
    // Asosiy nom sifatida ichki kod emas, tanish model nomini tanlaymiz
    const isCode = (p) => /samsung/i.test(brand) ? /^[AMJFS]\d{3}[A-Z]{0,2}$/.test(p)
      : /tecno/i.test(brand) ? /^([A-Z]{2}\d{1,3}[A-Z]{0,2}|S\d{3}[A-Z]{0,2}|\d{4}[A-Z]?)$/.test(p) : false;
    const mi = Math.max(0, parts.findIndex(p => !isCode(p)));
    const main = parts[mi] || String(raw);
    return { main, alts: parts.filter((_, i) => i !== mi), tags: [...tags] };
  }
  
  const products = SOURCE.map(p => { const pm = prettyModel(p.name, p.brand);
    return { ...p, _pm: pm, _key: norm([p.brand, p.name, pm.main, ...pm.alts].join(' ')) }; });
  const byId = new Map(products.map(p => [String(p.id), p]));
  $('modelCount').textContent = products.length;

  const typeClass = (t) => /oled/i.test(t) ? 'oled' : /servis/i.test(t) ? 'servis' : /tft/i.test(t) ? 'tft' : /incell/i.test(t) ? 'incell' : 'ips';

  let cart = {};
  try { cart = JSON.parse(sessionStorage.getItem('ekranchi_cart') || '{}'); } catch (e) { cart = {}; }
  for (const id in cart) if (!byId.has(id)) delete cart[id];
  const saveCart = () => { try { sessionStorage.setItem('ekranchi_cart', JSON.stringify(cart)); } catch (e) {} };

  let brand = 'Barchasi', query = '', delivery = 'BTS';
  const totalQty = () => Object.values(cart).reduce((a, b) => a + b, 0);
  const isWholesale = () => totalQty() >= WHOLESALE_MIN;
  const priceOf = (p, w) => w ? p.wholesale : p.retail;
  const cartSum = (w) => Object.entries(cart).reduce((s, [id, q]) => s + priceOf(byId.get(id), w) * q, 0);

  /* ---- hero xabarlari: data.js dagi bannersData ---- */
  if (typeof bannersData !== 'undefined' && bannersData.length > 1) {
    const clean = (s) => String(s).replace(/^[^\p{L}\p{N}]+/u, '');
    let bi = 0; const note = $('heroNote');
    setInterval(() => {
      bi = (bi + 1) % bannersData.length;
      note.style.opacity = 0;
      setTimeout(() => { note.textContent = clean(bannersData[bi].title); note.style.opacity = 1; }, 350);
    }, 5000);
  }

  /* ---- brend chiplari ---- */
  const brandCounts = products.reduce((m, p) => (m[p.brand] = (m[p.brand] || 0) + 1, m), {});
  const brandOrder = ['Barchasi', 'Samsung', 'iPhone', 'Redmi', 'Xiaomi', 'Tecno & Infinix', 'Honor', 'Oppo', 'Vivo', 'Realme', 'Huawei'];
  Object.keys(brandCounts).forEach(b => { if (!brandOrder.includes(b)) brandOrder.push(b); });
  const chips = $('chips');
  brandOrder.forEach(b => {
    const n = b === 'Barchasi' ? products.length : brandCounts[b];
    if (!n) return;
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'chip'; el.setAttribute('aria-pressed', String(b === brand));
    const label = document.createElement('span'); label.textContent = b;
    const cnt = document.createElement('i'); cnt.textContent = n;
    el.append(label, cnt);
    el.onclick = () => {
      haptic(); brand = b;
      chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
      el.setAttribute('aria-pressed', 'true'); applyFilter();
      const top = $('toolbar').getBoundingClientRect().top + window.scrollY;
      if (window.scrollY > top) window.scrollTo({ top, behavior: 'smooth' });
    };
    chips.appendChild(el);
  });

  /* ---- mahsulot qatorlari: bir marta chiziladi, keyin faqat o'zgargani yangilanadi ---- */
  const list = $('list');
  const rows = new Map();
  const frag = document.createDocumentFragment();
  products.forEach(p => {
    const tc = typeClass(p.type);
    const out = typeof p.stock === 'number' && p.stock <= 0;
    const el = document.createElement('article');
    el.className = 'row' + (out ? ' out' : '');
    el.innerHTML = `
      <div class="glyph t-${tc}" aria-hidden="true"></div>
      <div class="info">
        <div class="meta"><span class="br"></span><span class="type-tag ${tc}"></span></div>
        <div class="name"></div>
        <div class="alts" hidden></div>
        <div class="price"></div>
      </div>
      <div class="act"></div>`;
    el.querySelector('.br').textContent = p.brand;
    el.querySelector('.type-tag').textContent = p.type;
    el.querySelector('.name').textContent = p._pm.main;
    p._pm.tags.forEach(t => { const tag = document.createElement('span'); tag.className = 'type-tag' + (t === 'Ramkali' ? ' frame' : ''); tag.textContent = t; el.querySelector('.meta').appendChild(tag); });
    if (p._pm.alts.length) { const a = el.querySelector('.alts'); a.hidden = false;
      a.innerHTML = '<b>Mos keladi:</b> '; a.appendChild(document.createTextNode(p._pm.alts.join(', '))); a.title = 'Toʻliq roʻyxat'; }
    rows.set(String(p.id), { el, p, out, priceEl: el.querySelector('.price'), actEl: el.querySelector('.act') });
    frag.appendChild(el);
  });
  list.appendChild(frag);
  const emptyEl = document.createElement('div');
  emptyEl.className = 'empty'; emptyEl.hidden = true;
  emptyEl.innerHTML = '<strong>Bunday model topilmadi</strong>Boshqacha yozib koʻring, masalan “note8” yoki “a10”.<br><button type="button">Qidiruvni tozalash</button>';
  emptyEl.querySelector('button').onclick = () => { $('q').value = ''; query = ''; syncSearch(); chips.firstChild.click(); };
  list.appendChild(emptyEl);

  function renderPrice(r, w) {
    const p = r.p;
    if (r.out) { r.priceEl.innerHTML = '<span class="out-label">Hozircha omborda yoʻq</span>'; return; }
    r.priceEl.innerHTML = w
      ? `<b>${fmt(p.wholesale)}</b><s>${fmtN(p.retail)}</s>`
      : `<b>${fmt(p.retail)}</b><small>optom <em>${fmtN(p.wholesale)}</em></small>`;
    if (typeof p.stock === 'number' && p.stock > 0 && p.stock <= 5) r.priceEl.insertAdjacentHTML('beforeend', `<span class="low">Faqat ${p.stock} ta qoldi</span>`);
  }
  function renderAct(r) {
    const id = String(r.p.id), q = cart[id] || 0;
    r.el.classList.toggle('in-cart', q > 0);
    if (r.out) { r.actEl.innerHTML = '<button class="add" type="button" disabled>Tugagan</button>'; return; }
    if (!q) { r.actEl.innerHTML = `<button class="add" type="button" data-add="${id}">Qoʻshish</button>`; return; }
    const inp = r.actEl.querySelector('input[data-set]');
    if (inp) { if (document.activeElement !== inp || +inp.value !== q) inp.value = q; return; }
    r.actEl.innerHTML = stepperHTML(id, q);
  }
  const stepperHTML = (id, q) => `<div class="stepper">
      <button type="button" data-d="-1" data-id="${id}" aria-label="Kamaytirish">−</button>
      <input type="number" inputmode="numeric" min="0" value="${q}" data-set="${id}" aria-label="Soni">
      <button type="button" data-d="1" data-id="${id}" aria-label="Koʻpaytirish">+</button></div>`;

  let lastW = null;
  function refreshAll() {
    const w = isWholesale();
    if (w !== lastW) {
      document.body.classList.toggle('wholesale', w);
      rows.forEach(r => renderPrice(r, w));
      if (lastW !== null) {
        haptic(w ? 'heavy' : 'light');
        toast(w ? 'Optom narx yoqildi, hamma narx arzonlashdi' : 'Chakana narxga qaytdi');
      }
      lastW = w;
    }
    updateTape(); updateDock(); saveCart();
  }

  function setQty(id, q) {
    const r = rows.get(id); if (!r || r.out) return;
    q = Math.max(0, Math.min(9999, parseInt(q, 10) || 0));
    if (typeof r.p.stock === 'number' && r.p.stock > 0 && q > r.p.stock) { q = r.p.stock; toast(`Omborda ${r.p.stock} ta bor`); }
    if (q) cart[id] = q; else delete cart[id];
    renderAct(r); refreshAll();
    if ($('cartSheet').classList.contains('open')) requestAnimationFrame(renderCart);
  }

  document.addEventListener('click', (e) => {
    const alts = e.target.closest('.alts'); if (alts) { alts.classList.toggle('open'); return; }
    const add = e.target.closest('[data-add]');
    if (add) { haptic(); setQty(add.dataset.add, 1); bumpDock(); return; }
    const d = e.target.closest('[data-d]');
    if (d) { haptic(); setQty(d.dataset.id, (cart[d.dataset.id] || 0) + Number(d.dataset.d)); }
  });
  document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.set) setQty(e.target.dataset.set, e.target.value); });
  document.addEventListener('focusin', (e) => { if (e.target.dataset && e.target.dataset.set) e.target.select(); });

  /* ---- filtr ---- */
  function applyFilter() {
    const nq = norm(query); let shown = 0;
    rows.forEach(r => {
      const ok = (brand === 'Barchasi' || r.p.brand === brand) && (!nq || r.p._key.includes(nq));
      r.el.hidden = !ok; if (ok) shown++;
    });
    emptyEl.hidden = shown > 0;
    $('resultMeta').textContent = shown ? `${shown} ta model` + (brand !== 'Barchasi' ? `, ${brand}` : '') : '';
  }
  let qt;
  const syncSearch = () => { $('searchBox').classList.toggle('has-text', !!$('q').value); };
  $('q').addEventListener('input', (e) => { query = e.target.value; syncSearch(); clearTimeout(qt); qt = setTimeout(applyFilter, 120); });
  $('clearQ').onclick = (e) => { e.preventDefault(); $('q').value = ''; query = ''; syncSearch(); applyFilter(); $('q').focus(); };

  const sentinel = document.createElement('div'); $('toolbar').before(sentinel);
  new IntersectionObserver(([en]) => $('toolbar').classList.toggle('stuck', !en.isIntersecting)).observe(sentinel);

  /* ---- lenta va pastki panel ---- */
  function updateTape() {
    const q = totalQty(), done = q >= WHOLESALE_MIN;
    $('tape').style.width = Math.min(100, q / WHOLESALE_MIN * 100) + '%';
    $('tapeWrap').classList.toggle('done', done);
    $('tapeCount').textContent = done ? `${q} ta` : `${q}/${WHOLESALE_MIN}`;
    $('tapeText').textContent = done ? 'Optom narx yoqildi' : q ? `Optom narxgacha yana ${WHOLESALE_MIN - q} ta` : `${WHOLESALE_MIN} ta olsangiz, optom narx`;
    $('ruler').setAttribute('aria-valuenow', Math.min(q, WHOLESALE_MIN));
  }
  function updateDock() {
    const q = totalQty();
    $('dock').classList.toggle('hidden', q === 0);
    $('dockQty').textContent = `${q} ta ekran, ${isWholesale() ? 'optom' : 'chakana'}`;
    $('dockSum').textContent = fmt(cartSum(isWholesale()));
  }
  const bumpDock = () => { const d = $('dock'); d.classList.remove('bump'); void d.offsetWidth; d.classList.add('bump'); };

  /* ---- sheetlar ---- */
  const scrim = $('scrim');
  function openSheet(id) {
    document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
    $(id).classList.add('open'); scrim.classList.add('open');
    if (tg && tg.BackButton) tg.BackButton.show();
  }
  function closeSheets() {
    document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
    scrim.classList.remove('open');
    if (tg && tg.BackButton) tg.BackButton.hide();
  }
  scrim.onclick = closeSheets;
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
  if (tg && tg.BackButton) tg.BackButton.onClick(() => $('checkoutSheet').classList.contains('open') ? openCart() : closeSheets());

  function renderCart() {
    const box = $('cartLines'); box.innerHTML = '';
    const w = isWholesale();
    const ids = Object.keys(cart);
    if (!ids.length) { closeSheets(); return; }
    ids.forEach(id => {
      const p = byId.get(id), q = cart[id], pr = priceOf(p, w);
      const line = document.createElement('div'); line.className = 'line';
      line.innerHTML = `<div><div class="nm"></div><div class="sub">${q} × ${fmtN(pr)} = <b>${fmt(pr * q)}</b></div></div>${stepperHTML(id, q)}`;
      line.querySelector('.nm').textContent = `${p.brand} ${p._pm.main}` + (p._pm.alts.length ? ` (+${p._pm.alts.length} mos model)` : '') + (p._pm.tags.includes('Ramkali') ? ', ramkali' : '');
      box.appendChild(line);
    });
    const diff = cartSum(false) - cartSum(true);
    $('cartMode').textContent = w ? 'Optom narxda' : 'Chakana narxda';
    $('cartTotal').textContent = fmt(cartSum(w));
    $('saveNote').textContent = w
      ? `Optom narx bilan ${fmt(diff)} tejadingiz`
      : `Yana ${WHOLESALE_MIN - totalQty()} ta qoʻshsangiz, ${fmt(diff)} tejaysiz`;
  }
  function openCart() { if (!totalQty()) return; renderCart(); openSheet('cartSheet'); }
  $('dockBtn').onclick = () => { haptic(); openCart(); };
  $('clearCart').onclick = () => {
    const doClear = (ok) => { if (!ok) return; cart = {}; rows.forEach(renderAct); refreshAll(); closeSheets(); toast('Savat tozalandi'); };
    (inTelegram() && tg.showConfirm) ? tg.showConfirm('Savatdagi hamma tovarni olib tashlaymizmi?', doClear) : doClear(confirm('Savatni tozalaymizmi?'));
  };

  /* ---- rasmiylashtirish ---- */
  const nameIn = $('custName'), addrIn = $('custAddress');
  try { const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; if (u && u.first_name) nameIn.value = u.first_name.slice(0, 30); } catch (e) {}
  $('deliv').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    haptic(); delivery = b.dataset.v;
    $('deliv').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('addrLabel').textContent = delivery === 'BTS' ? 'BTS filiali va shahar/tuman' : 'Taksi uchun aniq manzil';
    addrIn.placeholder = delivery === 'BTS' ? 'Viloyat, tuman, filial' : 'Koʻcha, uy, moʻljal';
  });
  $('toCheckout').onclick = () => {
    haptic();
    const w = isWholesale();
    $('coMode').textContent = `${totalQty()} ta, ${w ? 'optom' : 'chakana'}`;
    $('coTotal').textContent = fmt(cartSum(w));
    openSheet('checkoutSheet');
  };
  $('backToCart').onclick = openCart;
  [nameIn, addrIn].forEach(i => i.addEventListener('input', () => i.closest('.field').classList.remove('invalid')));

  $('submitOrder').onclick = () => {
    const name = nameIn.value.trim(), addr = addrIn.value.trim();
    $('fName').classList.toggle('invalid', !name);
    $('fAddr').classList.toggle('invalid', !addr);
    if (!name || !addr) { haptic('medium'); return; }
    const w = isWholesale();
    // Server narx va jami summani o'zi qayta hisoblaydi; bu yerdagi summa faqat ma'lumot uchun.
    const payload = {
      n: name.slice(0, 30), d: delivery, a: addr.slice(0, 80),
      i: Object.entries(cart).map(([id, q]) => [parseInt(id, 10), q]),
      tq: totalQty(), ts: cartSum(w), pt: w ? 'Optom' : 'Chakana'
    };
    if (inTelegram() && tg.sendData) {
      try { sessionStorage.removeItem('ekranchi_cart'); } catch (e) {}
      tg.sendData(JSON.stringify(payload));
    } else {
      toast('Buyurtma faqat Telegram ichida yuboriladi. Botdagi “Doʻkonni ochish” tugmasidan kiring.');
    }
  };

  /* ---- start ---- */
  rows.forEach(renderAct);
