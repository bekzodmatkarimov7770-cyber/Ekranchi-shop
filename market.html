subtotal: subtotal });
      }
    }

    if (tg) {
      tg.sendData(JSON.stringify({
        name: name,
        delivery: delivery,
        address: address,
        items: items,
        total_qty: totalQty,
        total_sum: totalSum,
        price_type: isWholesale ? "Optom (50+)" : "Chakana"
      }));
    }
  }

  window.onload = () => {
    renderBanners();
    renderProducts();
  };
</script>
</body>
</html>
