<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:640px;height:640px;overflow:hidden}
body{background:radial-gradient(circle at 50% 35%,#5fb4ff 0%,#1a6dff 38%,#0a2f8f 72%,#04123d 100%);font-family:Arial,Helvetica,sans-serif}
.glow{position:absolute;left:170px;top:120px;width:300px;height:400px;border-radius:50%;background:#7fd0ff;filter:blur(70px);opacity:.55}
.shadow{position:absolute;left:180px;top:520px;width:300px;height:46px;border-radius:50%;background:#000;filter:blur(18px);opacity:.55}
.scene{position:absolute;inset:0;perspective:1100px}
.phone{position:absolute;left:215px;top:95px;width:210px;height:430px;transform-style:preserve-3d;transform:rotateY(-28deg) rotateX(10deg) rotateZ(4deg)}
.layer{position:absolute;inset:0;border-radius:42px;background:linear-gradient(90deg,#8a98ad,#e9eef5 30%,#9aa7b9 60%,#5d6a80)}
.front{position:absolute;inset:0;border-radius:42px;transform:translateZ(14px);background:linear-gradient(135deg,#f4f7fb,#a9b6c8 40%,#eef2f7 60%,#7c889c);padding:7px;box-sizing:border-box}
.bezel{width:100%;height:100%;border-radius:36px;background:#05070b;padding:9px;box-sizing:border-box}
.screen{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;
 background:radial-gradient(circle at 30% 20%,#9fe0ff 0%,#2f8bff 30%,#0f4fe0 60%,#081f7a 100%)}
.wave{position:absolute;left:-40%;width:180%;height:60%;border-radius:45%;opacity:.35}
.w1{top:48%;background:#5ec8ff;transform:rotate(-12deg)}
.w2{top:62%;background:#1238c9;opacity:.6;transform:rotate(8deg)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:64px;height:18px;border-radius:10px;background:#000;z-index:3}
.title{position:absolute;top:120px;width:100%;text-align:center;color:#fff;z-index:2;text-shadow:0 4px 14px rgba(0,20,80,.6)}
.title b{display:block;font-size:34px;font-weight:900;letter-spacing:-1px}
.title span{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:14px;background:#fff;color:#1565ff;font-weight:900;font-size:20px}
.gloss{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 28%,rgba(255,255,255,0) 42%);z-index:4}
.btn{position:absolute;right:-4px;width:6px;border-radius:3px;background:linear-gradient(90deg,#5d6a80,#c9d2de);transform:translateZ(7px)}
</style></head><body>
<div style="position:absolute;inset:0;transform:scale(1.2);transform-origin:50% 50%"><div class="glow"></div><div class="shadow"></div>
<div class="scene"><div class="phone">
 <div class="layer" style="transform:translateZ(0)"></div><div class="layer" style="transform:translateZ(3px)"></div>
 <div class="layer" style="transform:translateZ(6px)"></div><div class="layer" style="transform:translateZ(9px)"></div>
 <div class="layer" style="transform:translateZ(12px)"></div>
 <div class="btn" style="top:120px;height:60px"></div><div class="btn" style="top:200px;height:40px"></div>
 <div class="front"><div class="bezel"><div class="screen">
  <div class="island"></div><div class="wave w1"></div><div class="wave w2"></div>
  <div class="title"><b>DISPLEY</b><span>.UZ</span></div>
  <div class="gloss"></div>
 </div></div></div>
</div></div></div></body></html>
